[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slow-wednesday-radio"
version = "0.1.0"
description = "Deterministic local radio planning and FFmpeg streaming"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
slow-wednesday-radio = "slow_wednesday_radio.cli:main"

[tool.setuptools.packages.find]
include = ["slow_wednesday_radio*"]
